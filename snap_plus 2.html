<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سناب بلس | Snap plus</title>
<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif;
  color:#fff;overflow-x:hidden;
  background:
    radial-gradient(circle at 15% 15%,rgba(99,91,255,.35),transparent 30%),
    radial-gradient(circle at 85% 80%,rgba(0,191,255,.22),transparent 30%),
    linear-gradient(135deg,#070a16,#11172d 55%,#070a16);
}
.menu-toggle{position:absolute;opacity:0;pointer-events:none}
.menu-trigger{
  position:fixed;top:24px;right:24px;width:50px;height:50px;border-radius:50%;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  z-index:100;transition:.3s;box-shadow:0 8px 25px rgba(0,0,0,.2);
}
.menu-trigger:hover{background:rgba(255,255,255,.15);transform:scale(1.05)}
.menu-trigger span{width:20px;height:2px;background:#fff;border-radius:2px;transition:.3s}
.sidebar{
  position:fixed;top:0;right:-45%;width:45%;height:100vh;
  background:rgba(15,22,42,.65);backdrop-filter:blur(25px);-webkit-backdrop-filter:blur(25px);
  border-left:1px solid rgba(255,255,255,.12);box-shadow:-10px 0 40px rgba(0,0,0,.5);
  z-index:99;transition:right .4s cubic-bezier(.16,1,.3,1);padding:90px 16px 30px;
  display:flex;flex-direction:column;gap:20px;
}
.menu-toggle:checked ~ .sidebar{right:0}
.support-link{
  display:flex;align-items:center;justify-content:center;text-align:center;width:100%;
  padding:16px 10px;border-radius:18px;background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.15);color:#fff;text-decoration:none;
  font-size:clamp(14px,3.2vw,22px);font-weight:800;transition:.3s;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.support-link:hover{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.3);transform:translateY(-2px)}
.overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.3);backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .4s;z-index:98;
}
.menu-toggle:checked ~ .overlay{opacity:1;pointer-events:auto}
.page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:30px 18px}
.card{
  width:min(1050px,94%);min-height:650px;border:1px solid rgba(255,255,255,.14);
  border-radius:34px;background:rgba(255,255,255,.07);backdrop-filter:blur(20px);
  box-shadow:0 30px 90px rgba(0,0,0,.45);display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;padding:55px 25px;
}
.badge{padding:10px 20px;border-radius:999px;background:rgba(255,255,255,.1);color:#cbd2ff;margin-bottom:28px}
.title-container{position:relative;display:inline-block}
h1{
  margin:0;white-space:nowrap;font-size:clamp(30px,6.5vw,76px);
  background:linear-gradient(90deg,#fff,#aeb8ff,#70e7ff);
  -webkit-background-clip:text;background-clip:text;color:transparent;padding:0 16px;
}
.title-line{
  position:absolute;bottom:-10px;left:0;right:0;height:4px;
  background:linear-gradient(90deg,transparent,#635bff 20%,#00bfff 80%,transparent);
  border-radius:999px;box-shadow:0 0 12px rgba(0,191,255,.6);
}
p{color:#c7cbda;font-size:20px;line-height:1.8;margin:25px 0 45px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;
  padding:17px 48px;border-radius:18px;font-size:20px;font-weight:800;color:#fff;
  background:linear-gradient(90deg,#635bff,#00bfff);box-shadow:0 12px 35px rgba(55,130,255,.3);
  transition:transform .2s,box-shadow .2s;
}
.btn:hover{transform:translateY(-2px);box-shadow:0 15px 40px rgba(55,130,255,.45)}
.features{
  margin-top:32px;width:min(300px,100%);padding:18px 20px;background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.08);border-radius:22px;backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);box-shadow:0 10px 30px rgba(0,0,0,.25);
  display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:center;text-align:center;
}
.feature{font-size:16px;font-weight:700;color:#e2e7ff;line-height:1.2}
.divider{width:75%;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.15),transparent);margin:2px 0}
@media(max-width:600px){
  .sidebar{width:75%;right:-75%}
  .card{min-height:600px;padding:45px 18px}
  p{font-size:17px}
  .btn{padding:15px 35px;font-size:18px}
}
</style>
</head>
<body>
<input type="checkbox" id="menuToggle" class="menu-toggle">
<label for="menuToggle" class="menu-trigger" aria-label="القائمة">
  <span></span><span></span><span></span>
</label>
<label for="menuToggle" class="overlay"></label>
<div class="sidebar">
  <a class="support-link" href="https://www.tiktok.com/@fhcuq?_r=1&_t=ZS-9Aqlyj1rxii" target="_blank" rel="noopener">التواصل مع الدعم 💬</a>
</div>

<section class="page" id="home">
  <div class="card">
    <div class="badge">متجر إلكتروني • مرحبًا بك</div>
    <div class="title-container">
      <h1>سناب بلس | Snap plus</h1>
      <div class="title-line"></div>
    </div>
    <p>وجهتك لشراء البلس بسهولة وسرعة.<br>اضغط الزر بالأسفل للدخول إلى المتجر.</p>
    <a class="btn" href="https://www.tiktok.com/@.mt1s?_r=1&_t=ZS-9AqlCAE587t" target="_blank" rel="noopener">افتح المتجر</a>
    <div class="features">
      <div class="feature">تسليم شبه فوري و آمن⚡️</div>
      <div class="divider"></div>
      <div class="feature">نسبة الباند مستحيله 🔒</div>
      <div class="divider"></div>
      <div class="feature">تعامل بسهولة وبسرعة ⌛️</div>
    </div>
  </div>
</section>


</body>
</html>
